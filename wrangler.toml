name = "impro"
main = "./worker.js"
compatibility_date = "2026-04-14"
workers_dev = false

[build]
command = "npm run build"

[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/oauth-client-metadata.json"]

[[routes]]
pattern = "impro.vibe-coded.com"
custom_domain = true
